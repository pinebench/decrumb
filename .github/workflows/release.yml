name: Release

# Releasing = pushing a v* tag on main (spec §14). See RELEASING.md.
on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for what it needs.
permissions: {}

env:
  # Keep in sync with ci.yml.
  GORELEASER_VERSION: v2.18.3

jobs:
  # 1. The full CI suite (all three operating systems) on the tagged commit.
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # 2. Build, attest and publish. The only job with write permissions; waits
  #    for the owner's approval of the release environment.
  release:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Releases are cut from main only (spec §14).
      - name: Check that the tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; not releasing."
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Creates the release as a draft (release.draft in .goreleaser.yaml)
      # and uploads the archives and checksums.txt to it.
      - name: Build and upload (draft release)
        run: go run github.com/goreleaser/goreleaser/v2@${GORELEASER_VERSION} release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A final tag shares its commit with the RC tag: name the tag
          # explicitly instead of letting GoReleaser pick one.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      # The attestation bundle is published with the release, so it can also
      # be verified offline (gh attestation verify --bundle).
      - name: Upload attestation bundle
        run: |
          bundle="decrumb_${GITHUB_REF_NAME#v}_attestation.sigstore.json"
          cp "$BUNDLE_PATH" "$bundle"
          gh release upload "$GITHUB_REF_NAME" "$bundle"
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # Immutable releases: once published, files and tag can't change.
      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # 3. Smoke test: install the published release like a user would.
  smoke:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: read
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Only for testdata/cases.json and the rules SOURCE file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the archive for this runner
        run: |
          case "$RUNNER_OS" in
            Windows) os=windows; ext=zip ;;
            macOS)   os=darwin;  ext=tar.gz ;;
            Linux)   os=linux;   ext=tar.gz ;;
            *) echo "unsupported OS: $RUNNER_OS"; exit 1 ;;
          esac
          case "$RUNNER_ARCH" in
            X64)   arch=amd64 ;;
            ARM64) arch=arm64 ;;
            *) echo "unsupported architecture: $RUNNER_ARCH"; exit 1 ;;
          esac
          archive="decrumb_${TAG#v}_${os}_${arch}.${ext}"
          echo "Testing $archive"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          mkdir smoke
          gh release download "$TAG" --pattern "$archive" --pattern checksums.txt --dir smoke

      - name: Verify the SHA-256 against checksums.txt
        working-directory: smoke
        run: |
          want=$(awk -v f="$ARCHIVE" '$2 == f { print $1 }' checksums.txt)
          if [ -z "$want" ]; then echo "$ARCHIVE is not in checksums.txt"; exit 1; fi
          if command -v sha256sum > /dev/null; then
            got=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)
          else
            got=$(shasum -a 256 "$ARCHIVE" | cut -d' ' -f1)
          fi
          echo "want $want"
          echo "got  $got"
          [ "$want" = "$got" ]

      - name: Verify the attestations
        working-directory: smoke
        run: |
          gh attestation verify "$ARCHIVE" -o pinebench
          gh attestation verify checksums.txt -o pinebench

      - name: Extract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -Path "smoke/$env:ARCHIVE" -DestinationPath smoke/out

      - name: Extract (macOS, Linux)
        if: runner.os != 'Windows'
        run: mkdir smoke/out && tar -xzf "smoke/$ARCHIVE" -C smoke/out

      - name: Check the archive contents
        run: |
          bin=smoke/out/decrumb
          if [ "$RUNNER_OS" = Windows ]; then bin=smoke/out/decrumb.exe; fi
          for f in "$bin" README.md LICENSE NOTICE COPYING.LESSER COPYING clearurls/data.min.json; do
            f="${f#smoke/out/}"
            if [ ! -f "smoke/out/$f" ]; then echo "missing from archive: $f"; exit 1; fi
            echo "found $f"
          done
          echo "BIN=$bin" >> "$GITHUB_ENV"
          # The bundled rules file must be byte-for-byte the upstream file.
          want=$(awk '$1 == "sha256:" { print $2 }' internal/rules/clearurls/SOURCE)
          if command -v sha256sum > /dev/null; then
            got=$(sha256sum smoke/out/clearurls/data.min.json | cut -d' ' -f1)
          else
            got=$(shasum -a 256 smoke/out/clearurls/data.min.json | cut -d' ' -f1)
          fi
          echo "rules sha256 want $want got $got"
          [ "$want" = "$got" ]

      - name: decrumb --version shows the tag's version
        run: |
          "$BIN" --version
          first=$("$BIN" --version | head -n 1)
          [ "$first" = "decrumb $TAG" ] || { echo "expected \"decrumb $TAG\", got \"$first\""; exit 1; }

      - name: Clean the shared test cases
        run: |
          jq -r '.[].input' testdata/cases.json | tr -d '\r' > smoke/in.txt
          jq -r '.[].output' testdata/cases.json | tr -d '\r' > smoke/want.txt
          "$BIN" < smoke/in.txt > smoke/got.txt
          diff smoke/want.txt smoke/got.txt
          echo "$(wc -l < smoke/want.txt) cases passed"
