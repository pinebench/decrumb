name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  STATICCHECK_VERSION: v0.8.2
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION} ./...

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

      - name: Rules integrity (SHA-256 matches SOURCE)
        run: go test -count=1 -run '^TestBundledRulesMatchSource$' ./internal/rules/clearurls
